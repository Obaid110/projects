<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restaurant Menu & Order | Karachi Eats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/restaurants.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-utensils"></i>
        <span>Moon<span>Foods</span></span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link active">Restaurants</a>
        <a href="offers.html" class="nav-link">Deals & Offers</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-primary cart-drawer-trigger">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>View Cart</span>
          <span class="cart-count-badge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <div id="restaurant-hero-section"></div>

  <!-- Sticky Menu Categories Nav -->
  <div class="container">
    <div id="menu-categories-nav" class="sticky-category-bar"></div>
    <div id="menu-items-grid" style="padding: 24px 0 60px;"></div>
  </div>

  <!-- Cart Drawer Component -->
  <div id="cart-overlay" class="cart-drawer-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Your Cart</h3>
      <button id="close-cart-drawer" class="modal-close">&times;</button>
    </div>
    <div id="cart-items-container" class="cart-drawer-body"></div>
    <div id="cart-drawer-footer" class="cart-drawer-footer" style="display: none;"></div>
  </aside>

  <script type="module">
    import { initNavigation } from './assets/js/navigation.js';
    import { initRestaurantDetailsPage } from './assets/js/restaurants.js';
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      initRestaurantDetailsPage();
    });
  </script>
</body>

</html>
