<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Karachi Eats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>

<body
  style="background: var(--bg-subtle); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div
    style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 440px; padding: 36px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
        <i class="fa-solid fa-utensils"></i>
        <span>Moon<span>Foods</span></span>
      </a>
      <h2>Welcome Back</h2>
      <p class="text-muted">Log in to track your food orders in Karachi</p>
    </div>

    <form id="login-form">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px;">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="admin@karachieats.pk or customer email"
          required />
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 700; margin-bottom: 6px;">Password</label>
        <input type="password" id="login-password" class="form-control"
          placeholder="Min 6 characters (admin123 for admin)" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding: 12px;">Sign In</button>
    </form>

    <div
      style="margin-top: 20px; font-size: 0.85rem; text-align: center; background: var(--bg-subtle); padding: 12px; border-radius: var(--radius-md);">
      <strong>Demo Admin Credentials:</strong><br>
      Email: <code>admin@karachieats.pk</code> | Password: <code>admin123</code>
    </div>

    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
      Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Sign Up</a>
    </p>
  </div>

  <script type="module">
    import { Auth } from './assets/js/auth.js';
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const res = Auth.login(email, pass);
      if (res.success) {
        if (res.user.role === 'admin') {
          window.location.href = "admin/index.html";
        } else {
          window.location.href = "index.html";
        }
      }
    });
  </script>
</body>

</html>
