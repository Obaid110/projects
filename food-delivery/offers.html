<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deals & Offers | Karachi Eats</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo"><i class="fa-solid fa-utensils"></i> Karachi<span>Eats</span></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
        <a href="offers.html" class="nav-link active">Deals & Offers</a>
      </nav>
      <button class="btn btn-outline cart-drawer-trigger">
        <i class="fa-solid fa-bag-shopping"></i> <span>Cart</span>
        <span class="cart-count-badge" style="display: none;">0</span>
      </button>
    </div>
  </header>

  <main class="container" style="padding: 32px 16px 60px;">
    <div style="text-align: center; max-width: 600px; margin: 0 auto 32px;">
      <h1 class="section-title">Exclusive Food Deals</h1>
      <p class="text-muted" style="font-size: 0.9rem; margin-top: 6px;">Tap to copy promo code and save big on your Karachi orders.</p>
    </div>

    <div id="offers-list-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;"></div>
  </main>

  <!-- Cart Drawer Component -->
  <div id="cart-overlay" class="cart-drawer-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> Your Cart</h3>
      <button id="close-cart-drawer" class="modal-close">&times;</button>
    </div>
    <div id="cart-items-container" class="cart-drawer-body"></div>
    <div id="cart-drawer-footer" class="cart-drawer-footer" style="display: none;"></div>
  </aside>

  <script type="module">
    import { Storage } from './assets/js/storage.js';
    import { showToast } from './assets/js/utils.js';
    import { initNavigation } from './assets/js/navigation.js';

    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      const offers = Storage.getOffers();
      const grid = document.getElementById('offers-list-grid');

      grid.innerHTML = offers.map(o => `
        <div style="background: #FFFFFF; border: 2px dashed var(--primary); border-radius: var(--radius-lg); padding: 20px; position: relative; box-shadow: var(--shadow-xs);">
          <span class="badge" style="background: var(--primary-light); color: var(--primary); font-size: 0.78rem; margin-bottom: 12px; font-weight: 800;">
            ${o.discountPercent}% OFF
          </span>
          <h3 style="margin-bottom: 6px; font-size: 1.15rem;">${o.title}</h3>
          <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4;">${o.description}</p>
          <div style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-subtle); padding: 8px 12px; border-radius: var(--radius-md);">
            <strong style="letter-spacing: 1px; color: var(--primary); font-size: 1.05rem;">${o.code}</strong>
            <button class="btn btn-xs btn-primary copy-btn" data-code="${o.code}"><i class="fa-regular fa-copy"></i> Copy</button>
          </div>
          <small class="text-muted" style="display: block; margin-top: 10px; font-size: 0.78rem;">Min Spend: Rs. ${o.minSpend} • Valid till ${o.expiresAt}</small>
        </div>
      `).join('');

      grid.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(btn.dataset.code);
          showToast(`Coupon "${btn.dataset.code}" copied to clipboard!`, "success");
        });
      });
    });
  </script>
</body>
</html>
