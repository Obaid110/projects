<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | Karachi Eats Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand"><i class="fa-solid fa-utensils"></i> Karachi<span>Eats</span></div>
      <ul class="admin-menu">
        <li><a href="index.html" class="admin-menu-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li><a href="restaurants.html" class="admin-menu-link"><i class="fa-solid fa-store"></i> Restaurants</a></li>
        <li><a href="menus.html" class="admin-menu-link"><i class="fa-solid fa-bowl-food"></i> Food Menus</a></li>
        <li><a href="orders.html" class="admin-menu-link"><i class="fa-solid fa-receipt"></i> Orders</a></li>
        <li><a href="categories.html" class="admin-menu-link active"><i class="fa-solid fa-list"></i> Categories</a></li>
        <li><a href="delivery-areas.html" class="admin-menu-link"><i class="fa-solid fa-map-location-dot"></i> Delivery Areas</a></li>
        <li><a href="offers.html" class="admin-menu-link"><i class="fa-solid fa-tags"></i> Offers & Coupons</a></li>
        <li><a href="settings.html" class="admin-menu-link"><i class="fa-solid fa-gear"></i> Settings</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Food Categories</h1>
          <p class="text-muted">Manage available cuisines and taxonomy across the customer platform</p>
        </div>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Category Name</th>
              <th>Icon Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="categories-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { APP_CONFIG } from '../assets/js/config.js';
    import { Auth } from '../assets/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAdmin();
      const tbody = document.getElementById('categories-tbody');
      tbody.innerHTML = APP_CONFIG.categories.map(c => `
        <tr>
          <td><img src="${c.image}" class="table-thumb" alt="${c.name}" /></td>
          <td><strong>${c.name}</strong></td>
          <td><code>${c.icon}</code></td>
          <td><span class="badge badge-success">Active</span></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
